# Configuration for `cargo mutants`. CI mutates the lines each change touches,
# and the Deep checks workflow mutates whole modules on demand.

# The BoringSSL backend builds only with the `boringssl` feature, which needs
# a BoringSSL checkout, so the default build never compiles its mutants.
exclude_globs = ["src/backend/boringssl.rs"]

# Mutants that only skip or misplace a wipe of secret data. Wiping has no
# observable effect, so no test can kill them. Each pattern names the
# mutated operator, so the other mutants of these functions still run.
exclude_re = [
    # `RelationWriter::put` grows its buffer by hand to wipe the old one.
    # These mutants change when or how far it grows. None changes the
    # output: `extend_from_slice` grows the buffer itself, unwiped, or the
    # buffer doubles on every write until the mutant times out.
    "replace < with (==|>|<=) in RelationWriter<'a>::put$",
    "replace - with [+] in RelationWriter<'a>::put$",
    "replace [*] with [+] in RelationWriter<'a>::put$",
    "replace [+] with [*] in RelationWriter<'a>::put$",
    # `Commitments` only wipes its points when dropped.
    "replace <impl Drop for Commitments<P>>::drop with",
]
